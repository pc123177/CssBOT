name: Monitorar CSSDeals

on:
  schedule:
    - cron: "5-55/10 * * * *"
  workflow_dispatch:
    inputs:
      send_all:
        description: "Enviar todos os itens registrados (teste)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sniper-deals
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Monitorar e enviar alertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_ALL: ${{ github.event.inputs.send_all }}
        run: python sniper_deals.py
      - name: Salvar itens vistos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_ids.json docs/
          git diff --cached --quiet || git commit -m "chore: atualizar itens monitorados"
          git push
